# ---- Smart Performance Analytics Tool settings ----

# true  = save data in MySQL (needs MySQL running + the connector jar in the lib folder)
# false = save data in CSV files inside the data folder
db.enabled=true

# The database "smart_analytics" is created automatically if it does not exist.
db.url=jdbc:mysql://localhost:3306/smart_analytics?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
db.user=root
db.password=your_mysql_password

# Port for the web dashboard: http://localhost:8080
server.port=8080
